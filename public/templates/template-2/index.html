<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" /></noscript>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- INTRO: split curtain opener -->
  <div class="opener" data-opener>
    <div class="op-panel op-left"></div>
    <div class="op-panel op-right"></div>
    <div class="op-center">
      <p class="op-names"><span data-groom>—</span> &amp; <span data-bride>—</span></p>
      <p class="op-tap">Tap to open</p>
    </div>
  </div>

  <nav class="mini-nav">
    <span class="mono" data-initials>—</span>
    <span class="mono" data-date-short>—</span>
  </nav>

  <header class="hero reveal-up">
    <div class="hero-media" data-hero-media></div>
    <div class="hero-copy">
      <p class="guest-greeting" data-guest-greeting-section style="display:none"><span data-guest-greeting></span></p>
      <p class="label">The wedding of</p>
      <h1><span data-groom>—</span><br><span class="thin">and</span><br><span data-bride>—</span></h1>
      <p class="meta"><span data-date-long></span> · <span data-venue-name></span></p>
    </div>
  </header>

  <section class="cd reveal-up">
    <div class="today-msg" data-today style="display:none"></div>
    <div class="cd-line" data-countdown>
      <div><b data-cd-days>0</b><span data-i18n="days">days</span></div>
      <div><b data-cd-hours>0</b><span data-i18n="hours">hrs</span></div>
      <div><b data-cd-mins>0</b><span data-i18n="minutes">min</span></div>
      <div><b data-cd-secs>0</b><span data-i18n="seconds">sec</span></div>
    </div>
  </section>

  <section class="block reveal-up" data-schedule-section style="display:none">
    <p class="block-label" data-i18n="schedule">Schedule</p>
    <div class="tw-timeline" data-schedule></div>
  </section>

  <section class="block" data-story-timeline-section style="display:none">
    <p class="block-label" data-i18n="our_story">Our Story</p>
    <div data-story-timeline></div>
  </section>

  <section class="block reveal-up" data-story-section>
    <p class="block-label">01 — Our story</p>
    <p class="story" data-story></p>
  </section>

  <section class="block reveal-up">
    <p class="block-label">02 — Details</p>
    <div class="detail-rows">
      <div class="row"><span class="k">Date</span><span class="v" data-date-long></span></div>
      <div class="row"><span class="k">Time</span><span class="v" data-time></span></div>
      <div class="row"><span class="k">Venue</span><span class="v" data-venue-name></span></div>
      <div class="row"><span class="k">Address</span><span class="v" data-venue-address></span></div>
    </div>
    <div class="map-block" data-map-section style="display:none">
      <div class="map-embed" data-map-embed></div>
      <a class="directions-btn" data-directions href="#" data-i18n="directions">Get Directions</a>
    </div>
  </section>

  <section class="block reveal-up" data-gallery-section>
    <p class="block-label">03 — Gallery</p>
    <div class="grid-imgs" data-gallery></div>
  </section>

  <section class="block reveal-up">
    <p class="block-label" data-i18n="rsvp">04 — RSVP</p>
    <form data-thewed-rsvp class="rsvp">
      <input type="text" name="guest_name" placeholder="Your name" required />
      <div class="tw-rsvp-actions">
        <button type="submit" data-attending="yes" class="tw-rsvp-yes" data-i18n="accept">Joyfully Accept</button>
        <button type="submit" data-attending="no" class="tw-rsvp-no" data-i18n="decline">Decline</button>
      </div>
      <p class="status" data-rsvp-status></p>
    </form>
    <p class="rsvp-phone mono" data-rsvp-phone></p>
    <p style="margin-top:16px"><a class="share-btn" data-share-whatsapp href="#" data-i18n="share">Share on WhatsApp</a></p>
  </section>

  <section class="block reveal-up" data-guestbook-section>
    <p class="block-label" data-i18n="wishes">05 — Wishes</p>
    <form data-wish-form class="wish-form">
      <input type="text" name="guest_name" data-i18n-ph="wish_name" placeholder="Your name" required />
      <textarea name="message" rows="2" data-i18n-ph="wish_msg" placeholder="Your wish for the couple" required></textarea>
      <button type="submit" data-i18n="wish_send">Post wish</button>
      <p class="status" data-wish-status></p>
    </form>
    <div class="wishes-list" data-wishes></div>
  </section>

  <footer class="foot">
    <p class="hashtag mono" data-hashtag></p>
    <p class="mono dim">TheWed</p>
  </footer>

  <script src="/templates/_shared/thewed.js"></script>
  <script src="script.js"></script>
</body>
</html>
