<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Barlow+Condensed:wght@300;400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Barlow+Condensed:wght@300;400;500&display=swap" /></noscript>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- INTRO: cinematic letterbox opener -->
  <div class="opener" data-opener>
    <div class="op-bar op-top"></div>
    <div class="op-bar op-bottom"></div>
    <div class="op-center">
      <p class="op-kicker">The wedding film of</p>
      <p class="op-names"><span data-groom>—</span> &amp; <span data-bride>—</span></p>
      <p class="op-tap">▶ Tap to begin</p>
    </div>
  </div>

  <header class="hero">
    <div class="hero-bg" data-parallax data-hero-bg></div>
    <div class="hero-scrim"></div>
    <div class="hero-content">
      <p class="guest-greeting" data-guest-greeting-section style="display:none"><span data-guest-greeting></span></p>
      <p class="kicker" data-reveal>— The wedding of —</p>
      <h1 class="title">
        <span data-reveal data-groom>—</span>
        <span class="amp" data-reveal>&amp;</span>
        <span data-reveal data-bride>—</span>
      </h1>
      <p class="sub" data-reveal><span data-date-long></span></p>
      <p class="sub small" data-reveal data-venue-name></p>
    </div>
    <div class="scroll-cue">SCROLL</div>
  </header>

  <section class="cd-section">
    <div class="today-msg" data-today style="display:none"></div>
    <div class="cd" data-countdown data-reveal>
      <div><b data-cd-days>0</b><span data-i18n="days">Days</span></div>
      <i>:</i>
      <div><b data-cd-hours>0</b><span data-i18n="hours">Hours</span></div>
      <i>:</i>
      <div><b data-cd-mins>0</b><span data-i18n="minutes">Minutes</span></div>
      <i>:</i>
      <div><b data-cd-secs>0</b><span data-i18n="seconds">Seconds</span></div>
    </div>
  </section>

  <section class="schedule-section" data-schedule-section style="display:none">
    <h2 data-reveal data-i18n="schedule">Schedule</h2>
    <div class="tw-timeline" data-schedule></div>
  </section>

  <section class="details-section" data-story-timeline-section style="display:none">
    <div class="details-inner">
      <h2 data-i18n="our_story">Our Story</h2>
      <div data-story-timeline></div>
    </div>
  </section>

  <section class="story-section" data-story-section>
    <div class="story-media" data-parallax data-story-media></div>
    <div class="story-copy">
      <h2 data-reveal>Our Story</h2>
      <p data-reveal data-story></p>
    </div>
  </section>

  <section class="details-section">
    <div class="details-inner">
      <h2 data-reveal>The Celebration</h2>
      <div class="detail-line" data-reveal><span class="lbl">When</span><span data-date-long></span> · <span data-time></span></div>
      <div class="detail-line" data-reveal><span class="lbl">Where</span><span data-venue-name></span></div>
      <div class="detail-line" data-reveal><span class="lbl">Address</span><span data-venue-address></span></div>
      <div class="map-block" data-map-section data-reveal style="display:none">
        <div class="map-embed" data-map-embed></div>
        <a class="directions-btn" data-directions href="#" data-i18n="directions">Get Directions</a>
      </div>
    </div>
  </section>

  <section class="gallery-section" data-gallery-section>
    <h2 data-reveal>Moments</h2>
    <div class="gallery" data-gallery></div>
  </section>

  <section class="rsvp-section">
    <h2 data-reveal data-i18n="rsvp">Reserve your seat</h2>
    <form data-thewed-rsvp class="rsvp" data-reveal>
      <label data-i18n="name">Full name<input type="text" name="guest_name" required /></label>
      <label data-i18n="attend_q">Attending<select name="attending"><option value="yes" data-i18n="yes">Yes — count me in</option><option value="no" data-i18n="no">No — with regret</option></select></label>
      <div style="display:flex;gap:12px;">
        <label style="flex:1;" data-i18n="adults">Adults<input type="number" name="guest_count" min="0" value="1" /></label>
        <label style="flex:1;" data-i18n="children">Children<input type="number" name="children_count" min="0" value="0" /></label>
      </div>
      <label data-i18n="message">Message<textarea name="message" rows="3"></textarea></label>
      <button type="submit" data-i18n="send">Confirm attendance</button>
      <p class="status" data-rsvp-status></p>
    </form>
    <p class="rsvp-phone" data-rsvp-phone></p>
    <p style="text-align:center;margin-top:18px"><a class="share-btn" data-share-whatsapp href="#" data-i18n="share">Share on WhatsApp</a></p>
  </section>

  <section class="guestbook-section" data-guestbook-section>
    <h2 data-reveal data-i18n="wishes">Wishes &amp; Blessings</h2>
    <form data-wish-form class="wish-form" data-reveal>
      <input type="text" name="guest_name" data-i18n-ph="wish_name" placeholder="Your name" required />
      <textarea name="message" rows="2" data-i18n-ph="wish_msg" placeholder="Your wish for the couple" required></textarea>
      <button type="submit" data-i18n="wish_send">Post wish</button>
      <p class="status" data-wish-status></p>
    </form>
    <div class="wishes-list" data-wishes></div>
  </section>

  <footer class="foot">
    <p class="hashtag" data-hashtag></p>
    <p class="made">TheWed</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="/templates/_shared/thewed.js"></script>
  <script src="script.js"></script>
</body>
</html>
