<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation — TheWed</title>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #frame { border: 0; width: 100%; height: 100vh; display: block; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--cream); z-index: 5; }
    #splash .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); margin: 0 4px; display: inline-block; animation: bounce 1s infinite ease-in-out; }
    #splash .dot:nth-child(2){ animation-delay: .15s; } #splash .dot:nth-child(3){ animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100%{ transform: translateY(0); opacity:.5 } 40%{ transform: translateY(-10px); opacity:1 } }
  </style>
</head>
<body>
  <div id="splash"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <iframe id="frame" title="Wedding invitation"></iframe>

  <script>
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const frame = document.getElementById('frame');
    const splash = document.getElementById('splash');
    let payload = null;
    let ready = false;

    function post() {
      if (ready && payload) {
        frame.contentWindow.postMessage({ type: 'thewed:data', data: payload }, '*');
        splash.style.display = 'none';
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'thewed:ready') { ready = true; post(); }
    });

    async function load() {
      try {
        const res = await fetch('/api/invitations/public/' + encodeURIComponent(slug));
        if (res.status === 404 || res.status === 410) { location.replace('/unavailable'); return; }
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        data.mode = 'live';
        // Per-guest personalization (?to=Name) + canonical share URL live on the
        // parent page; the template runs in the iframe, so pass them in.
        const params = new URLSearchParams(location.search);
        data.guestName = params.get('to') || '';
        data.publicUrl = location.origin + '/i/' + encodeURIComponent(slug);
        payload = data;
        document.title = `${data.invitation.groomName} & ${data.invitation.brideName} — Wedding Invitation`;
        frame.src = '/templates/' + data.template.folderKey + '/index.html';
        // In case the frame was already ready (cached) before payload arrived:
        frame.addEventListener('load', () => { /* ready message will drive post() */ });
      } catch (err) {
        location.replace('/unavailable');
      }
    }
    load();
  </script>
</body>
</html>
